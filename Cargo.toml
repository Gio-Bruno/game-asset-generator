[workspace]
members = ["crates/forge-core", "crates/forge-cli", "crates/forge-studio"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
